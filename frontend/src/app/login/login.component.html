<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Mediflow</h2>
      <p>Sistema de Gestión Médica</p>
    </div>

    <!-- Botón oficial de Google (lo dibuja la librería de Google Identity Services) -->
    <div class="google-btn-wrapper">
      <div #googleButton></div>
      <span class="google-loading" *ngIf="!googleReady">Cargando acceso con Google...</span>
    </div>

    <div class="divider">
      <span>o ingresa con correo</span>
    </div>

    <div class="login-error" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form (submit)="onSubmit(); $event.preventDefault()">
      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="tucorreo@example.com" class="form-input" autocomplete="email" required />
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="password" name="password" placeholder="Mínimo 6 caracteres" class="form-input" autocomplete="current-password" minlength="6" required />
      </div>
      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Verificando...' : 'Acceder / Registrarse' }}
      </button>
    </form>
  </div>
</div>
