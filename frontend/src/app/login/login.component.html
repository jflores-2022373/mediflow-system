<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Mediflow</h2>
      <p>Sistema de Gestión Médica</p>
    </div>

    <!-- Botón de Google Fijo y Estable (nunca se desvanece ni desaparece) -->
    <div class="google-btn-wrapper">
      <button type="button" class="btn-google-fixed" (click)="loginWithGoogle()">
        <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.2v3.15C3.18 21.32 7.23 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.2C.43 8.13 0 9.89 0 12s.43 3.87 1.2 5.42l4.08-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.18 2.68 1.2 6.58l4.08 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        <span>Continuar con Google</span>
      </button>
    </div>

    <div class="divider">
      <span>o ingresa con correo</span>
    </div>

    <form (submit)="onSubmit(); $event.preventDefault()">
      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="tucorreo@example.com" class="form-input" required />
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" class="form-input" required />
      </div>
      <button type="submit" class="btn-primary">Acceder / Registrarse</button>
    </form>
  </div>
</div>
